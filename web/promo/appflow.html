<!DOCTYPE html>

<body>

<script>
/* ============ Open Agent Team 完整宣传片（Canvas 模拟界面动画） ============ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d')
const W = 1280, H = 720
const FONT = '"Microsoft YaHei","Segoe UI",sans-serif'
const MONO = 'Consolas,"Courier New",monospace'
window.__duration = 176
let t0 = performance.now()
const T = () => (performance.now() - t0) / 1000
const clamp = (x, a, b) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1)
const ease = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2
const lerp = (a, b, k) => a + (b - a) * k
const COL = {
  bg: '#0e1013', soft: '#14161a', card: '#191c21', border: '#262a31', deep: '#101216',
  text: '#e7e9ee', dim: '#8b919d', accent: '#2f9e8f', accentSoft: '#1b3a36',
  ok: '#48b97a', warn: '#cfa04a', err: '#d06060', white: '#ffffff',
}
const LIGHT = { bg: '#f4f6fa', soft: '#eef1f6', card: '#ffffff', border: '#d7dde8', deep: '#ffffff', text: '#1c2230', dim: '#68738a' }
let THEME = { ...COL }
const C = () => THEME

/* ── 基础绘制 ── */
function rr(x, y, w, h, r, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath()
  if (fill) { ctx.fillStyle = fill; ctx.fill() }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke() }
}
function tx(s, x, y, o = {}) {
  const { size = 14, color = C().text, align = 'left', font = FONT, alpha = 1, bold = false } = o
  ctx.save(); ctx.globalAlpha *= alpha
  ctx.fillStyle = color; ctx.font = `${bold ? '700 ' : ''}${size}px ${font}`
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.restore()
}
function clipText(s, max) { return s.length > max ? s.slice(0, max) + '…' : s }
function typeStr(full, t, a, b) { return full.slice(0, Math.floor(seg(t, a, b) * full.length)) }
window.__seek = (s) => { t0 = performance.now() - s * 1000 }

/* ── 相机（世界→屏幕）── */
const CAMS = [
  { t: 0, x: 640, y: 360, s: 1.0 }, { t: 7, x: 640, y: 360, s: 1.0 },
  { t: 8.5, x: 640, y: 360, s: 1.02 }, { t: 10, x: 190, y: 250, s: 1.7 },
  { t: 14.5, x: 190, y: 250, s: 1.7 }, { t: 16, x: 640, y: 360, s: 1.15 },
  { t: 20.5, x: 640, y: 360, s: 1.15 }, { t: 22, x: 190, y: 260, s: 1.7 },
  { t: 25, x: 190, y: 260, s: 1.7 }, { t: 26.5, x: 640, y: 360, s: 1.15 },
  { t: 31, x: 640, y: 420, s: 1.25 }, { t: 40, x: 640, y: 420, s: 1.25 },
  { t: 41.5, x: 640, y: 360, s: 1.0 }, { t: 54, x: 640, y: 360, s: 1.0 },
  { t: 55.5, x: 640, y: 320, s: 1.05 }, { t: 78, x: 640, y: 320, s: 1.05 },
  { t: 79.5, x: 640, y: 380, s: 1.05 }, { t: 108, x: 640, y: 380, s: 1.05 },
  { t: 109.5, x: 640, y: 360, s: 1.0 }, { t: 120, x: 640, y: 360, s: 1.0 },
  { t: 121.5, x: 640, y: 360, s: 1.0 }, { t: 130, x: 640, y: 360, s: 1.0 },
  { t: 131.5, x: 640, y: 360, s: 1.0 }, { t: 140, x: 640, y: 360, s: 1.0 },
  { t: 141.5, x: 640, y: 360, s: 1.05 }, { t: 158, x: 640, y: 360, s: 1.05 },
  { t: 159.5, x: 640, y: 360, s: 1.0 }, { t: 176, x: 640, y: 360, s: 1.0 },
]
function camAt(t) {
  let i = 0
  while (i < CAMS.length - 2 && t > CAMS[i + 1].t) i++
  const a = CAMS[i], b = CAMS[i + 1]
  const k = ease(seg(t, a.t, b.t))
  return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), s: lerp(a.s, b.s, k) }
}
function withCam(t, fn) {
  const c = camAt(t)
  ctx.save()
  ctx.translate(W / 2, H / 2); ctx.scale(c.s, c.s); ctx.translate(-c.x, -c.y)
  fn()
  ctx.restore()
}
/* 世界坐标 = 屏幕坐标（相机围绕中心缩放平移） */

/* ── 鼠标 ── */
const MOUSE = [
  { t: 7, x: 1250, y: 700 }, { t: 10, x: 120, y: 258 }, { t: 10.6, x: 120, y: 258, click: true },
  { t: 14, x: 430, y: 300 }, { t: 16.5, x: 640, y: 470 }, { t: 19, x: 610, y: 520, click: true },
  { t: 22, x: 120, y: 300, click: true }, { t: 26, x: 430, y: 320 }, { t: 28.5, x: 640, y: 500, click: true },
  { t: 31.5, x: 640, y: 610 }, { t: 40, x: 900, y: 610 },
  { t: 42, x: 1150, y: 90, click: true }, { t: 54, x: 900, y: 300 },
  { t: 56, x: 300, y: 105, click: true }, { t: 62, x: 430, y: 90, click: true }, { t: 70, x: 640, y: 300, click: true },
  { t: 79, x: 200, y: 105, click: true }, { t: 84, x: 640, y: 470 }, { t: 90, x: 620, y: 620, click: true },
  { t: 108, x: 640, y: 620 }, { t: 111, x: 1150, y: 105, click: true }, { t: 114, x: 640, y: 500, click: true },
  { t: 121, x: 1150, y: 75, click: true }, { t: 125, x: 900, y: 300 },
  { t: 131, x: 1150, y: 105, click: true },
  { t: 143, x: 500, y: 250, click: true }, { t: 146.5, x: 560, y: 250, click: true }, { t: 150, x: 500, y: 250, click: true }, { t: 154, x: 620, y: 250 },
  { t: 160, x: 400, y: 300 }, { t: 163.5, x: 400, y: 300, click: true }, { t: 166, x: 660, y: 300, click: true },
]
function mouseAt(t) {
  let i = 0
  while (i < MOUSE.length - 2 && t > MOUSE[i + 1].t) i++
  if (t <= MOUSE[0].t) return { x: MOUSE[0].x, y: MOUSE[0].y, click: 0 }
  const a = MOUSE[i], b = MOUSE[i + 1]
  const k = ease(seg(t, a.t, b.t))
  const clickT = MOUSE.filter(m => m.click && t >= m.t && t < m.t + 1).map(m => m.t).pop()
  return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), visible: t > MOUSE[0].t, click: clickT ? 1 - (t - clickT) : 0 }
}
function drawMouse(m) {
  if (!m || !m.visible) return
  if (m.click > 0) { ctx.beginPath(); ctx.arc(m.x, m.y, 26 * (1 - m.click), 0, 7); ctx.strokeStyle = `rgba(47,158,143,${m.click})`; ctx.lineWidth = 2; ctx.stroke() }
  ctx.save()
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5
  ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x, m.y + 18); ctx.lineTo(m.x + 5, m.y + 13); ctx.lineTo(m.x + 11, m.y + 20); ctx.lineTo(m.x + 14, m.y + 17); ctx.lineTo(m.x + 8, m.y + 10); ctx.lineTo(m.x + 14, m.y + 8); ctx.closePath()
  ctx.fill(); ctx.stroke()
  ctx.restore()
}

/* ── 应用窗口绘制 ── */
const AW = { x: 40, y: 40, w: 1200, h: 640 }
const TABS = ['对话', '团队任务', 'API 仓库', '团队配置', '插件', '项目', '统计', '设置']
let appView = 'chat' // 由时间线切换
function drawAppFrame(t, content) {

  rr(AW.x, AW.y, AW.w, AW.h, 14, c.bg, c.border, 1.5)
  // 顶栏
  rr(AW.x, AW.y, AW.w, 46, 14, c.soft)
  ctx.fillStyle = c.soft; ctx.fillRect(AW.x, AW.y + 30, AW.w, 16)
  tx('Open Agent Team', AW.x + 58, AW.y + 24, { size: 15, bold: true })
  rr(AW.x + 14, AW.y + 8, 30, 30, 8, c.accent)
  tx('AI', AW.x + 29, AW.y + 23, { size: 12, bold: true, color: '#fff', align: 'center' })
  const tabW = 78
  TABS.forEach((s, i) => {
    const x = AW.x + 240 + i * (tabW + 6)
    const active = s === tabLabel(appView)
    rr(x, AW.y + 9, tabW, 28, 7, active ? c.card : 'transparent', active ? c.border : 'transparent')
    tx(s, x + tabW / 2, AW.y + 23, { size: 12, color: active ? c.text : c.dim, align: 'center' })
  })
  // 顶栏右侧
  rr(AW.x + AW.w - 220, AW.y + 10, 130, 26, 7, c.card, c.border)
  tx('E:\\集合工作站\\workspace', AW.x + AW.w - 155, AW.y + 23, { size: 10, color: c.dim, align: 'center' })
  rr(AW.x + AW.w - 80, AW.y + 10, 66, 26, 7, c.accent)
  tx('+ 添加 API', AW.x + AW.w - 47, AW.y + 23, { size: 11, color: '#fff', align: 'center' })
  // 内容区
  ctx.save(); ctx.beginPath(); ctx.rect(AW.x, AW.y + 46, AW.w, AW.h - 46); ctx.clip()
  content()
  ctx.restore()
}
function tabLabel(v) { return { chat: '对话', team: '团队任务', providers: 'API 仓库', teamconfig: '团队配置', plugins: '插件', github: '项目', stats: '统计', settings: '设置' }[v] || '' }
/* 侧栏（对话/团队视图） */
function drawSidebar(t, providers) {
  const c = C()
  rr(AW.x, AW.y + 46, 240, AW.h - 46, 0, c.soft)
  tx('已登记 API（' + providers.length + '）', AW.x + 14, AW.y + 72, { size: 12, color: c.dim })
  providers.forEach((p, i) => {
    const y = AW.y + 88 + i * 92
    rr(AW.x + 10, y, 220, 84, 9, i === 0 ? c.accentSoft : c.card, i === 0 ? '#3d6f68' : c.border)
    tx(p.name, AW.x + 22, y + 20, { size: 13, bold: true })
    tx(p.url, AW.x + 22, y + 40, { size: 10, color: c.dim })
    const bw = [42, 30, 38]
    let bx = AW.x + 22
    ;['对话', '代码', '模型 ' + p.n].forEach((b, k) => { rr(bx, y + 50, bw[k] + 14, 16, 8, c.deep, c.border); tx(b, bx + (bw[k] + 14) / 2, y + 58, { size: 9, color: c.dim, align: 'center' }); bx += bw[k] + 20 })
    if (p.bal) tx(p.bal, AW.x + 22, y + 76, { size: 11, color: c.ok, bold: true })
  })
  // 添加 API 入口
  const hy = AW.y + AW.h - 70
  rr(AW.x + 10, hy, 220, 34, 9, 'transparent', c.border)
  ctx.setLineDash([5, 4]); ctx.strokeStyle = c.border
  rr(AW.x + 10, hy, 220, 34, 9, null, c.border); ctx.setLineDash([])
  tx('＋ 添加 API', AW.x + 120, hy + 17, { size: 12, color: c.dim, align: 'center' })
}
/* 主内容：各页面 */
function drawChatView(t, msgs, typed, replyShown, replyText) {
  const c = C()
  const X = AW.x + 250, Y = AW.y + 56, Wd = AW.w - 260, Hd = AW.h - 66
  rr(X, Y, Wd, 40, 9, c.soft, c.border)
  tx('使用 API：', X + 12, Y + 20, { size: 11, color: c.dim })
  rr(X + 70, Y + 8, 130, 24, 6, c.card, c.border); tx('DeepSeek v4.1', X + 80, Y + 20, { size: 11 })
  tx('模型：', X + 214, Y + 20, { size: 11, color: c.dim })
  rr(X + 252, Y + 8, 120, 24, 6, c.card, c.border); tx('deepseek-chat', X + 262, Y + 20, { size: 11 })
  rr(X + Wd - 90, Y + 8, 78, 24, 6, 'transparent', c.border); tx('清空对话', X + Wd - 51, Y + 20, { size: 10, color: c.dim, align: 'center' })
  // 消息
  let my = Y + 70
  msgs.forEach((m) => {
    if (m.me) {
      const w = 360
      rr(X + Wd - w - 20, my, w, 48, 10, c.accentSoft, '#3d6f68')
      tx(clipText(m.text, 22), X + Wd - w, my + 24, { size: 13 })
      my += 64
    } else {
      const w = 460
      rr(X + 20, my, w, m.title ? 92 : 64, 10, c.card, c.border)
      tx('AI' + (m.title ? ' · ' + m.title : ''), X + 34, my + 20, { size: 11, color: c.dim })
      tx(m.text.slice(0, 30), X + 34, my + 44, { size: 12 })
      my += m.title ? 108 : 80
    }
  })
  // 输入区
  const iy = Y + Hd - 66
  rr(X + 10, iy, Wd - 20, 56, 10, c.card, c.border)
  tx(typed || '输入指令，/ 查看命令，Enter 发送', X + 26, iy + 28, { size: 12, color: typed ? c.text : '#5b6472' })
  rr(X + Wd - 96, iy + 8, 76, 40, 9, c.accent)
  const hot = seg(t, 33.5, 34) * (1 - seg(t, 34.4, 34.8)) > 0 ? .5 : 0
  tx('发送', X + Wd - 58, iy + 28, { size: 12, color: '#fff', align: 'center', alpha: 1 - hot })
}
/* 新增 API 弹窗 */
function drawApiModal(t, fill) {

    const v = r[1]

/* API 仓库页 */
function drawProviders(t, dash) {

  const cards = [
    { n: 'DeepSeek', lines: ['余额', '¥' + (31.54 * ease(seg(t, 43, 46))).toFixed(2)], bars: null, color: c.ok },
    { n: '阿里云百炼', lines: ['模型', Math.round(261 * ease(seg(t, 44, 47))) + ' 个 · 自动分类'], bars: null, color: '#8fd0ff' },
    { n: 'OpenCode Go', lines: ['订阅窗口', '滚动 / 每周 / 月度'], bars: [[.11, '滚动(5h)'], [.20, '每周'], [.15, '月度']], color: '#c9a6ff' },
  ]
  cards.forEach((cd, i) => {

  // 主题（浅色切换在设置段：145.2 扩散 → 150 回深色）
  const lightOn = t > 145.3 && t < 150.2
  THEME = lightOn ? LIGHT : COL
  // 各阶段视图切换
  appView = t < 40 ? 'chat' : t < 54 ? 'providers' : t < 78 ? 'teamconfig' : t < 108 ? 'team' : t < 120 ? 'plugins' : t < 130 ? 'github' : t < 140 ? 'stats' : t < 158 ? 'settings' : 'chat'
  ctx.fillStyle = C().bg; ctx.fillRect(0, 0, W, H)
  if (t >= 158) { drawFolderScene(t); drawMouse(mouseAt(t)); drawScanlines(); return }
  if (t >= 168) { drawCredits(t); drawScanlines(); return }
  withCam(t, () => {
    drawAppFrame(t, () => {
      if (appView === 'chat') {
        drawSidebar(t, t < 22
          ? [{ name: 'OpenCode Go / Zen', url: 'https://opencode.ai/zen/go/v1', n: 1 }]
          : [
            { name: 'DeepSeek v4.1', url: 'https://api.deepseek.com', n: 2, bal: '¥31.54' },
            { name: '阿里云百炼', url: 'https://dashscope.aliyuncs.com/...', n: 261, bal: '连通正常' },
            { name: 'OpenCode Go / Zen', url: 'https://opencode.ai/zen/go/v1', n: 1, bal: '订阅 11% / 20% / 15%' },
          ])
        const msgs = []
        if (t > 32.5) msgs.push({ me: true, text: '你好，你是什么模型？' })
        const replyOn = t > 36.5
        if (replyOn) msgs.push({ title: '工具协议', text: '我是 DeepSeek 模型，可以帮你读写文件、跑命令…' })
        drawChatView(t, msgs, t > 31.5 && t < 34.2 ? typeStr('你好，你是什么模型？', t, 31.5, 33.6) : '', replyOn, '')
      }
      if (appView === 'providers') drawProviders(t)
      if (appView === 'teamconfig') drawTeamConfig(t)
      if (appView === 'team') drawTeamView(t)
      if (appView === 'plugins') drawPlugins(t)
      if (appView === 'github') drawGithub(t)
      if (appView === 'stats') drawStats(t)
      if (appView === 'settings') {
        const fs2 = 1 + .5 * ease(seg(t, 147.5, 149.8)) - .5 * ease(seg(t, 152.5, 154.5))
        drawSettings(t, fs2, t > 145.3 && t < 150.2)
      }
      // 添加 API / 新建会话弹窗
      if (t > 14.5 && t < 22) drawApiModal(t, {
        tpl: t > 15.5, name: t > 16.2 ? typeStr('DeepSeek v4.1', t, 16.2, 17) : '',
        url: t > 17 ? typeStr('https://api.deepseek.com', t, 17, 18.2) : '',
        key: t > 18.2 ? typeStr('sk-IVKEWYTYWRTQOGNVXTHONVCTKKNBTVJBLVVPTLKWSSNRA', t, 18.2, 19.6) : '',
      })
      if (t > 24 && t < 31) drawSessionModal(t, { title: t > 25 ? typeStr('我的第一个会话', t, 25, 26.2) : '' }, false)
    })
    drawMouse(mouseAt(t))
    // 浅色扩散转场：以中心向外扩散
    if (t > 144.6 && t < 145.6) {
      const k = ease(seg(t, 144.6, 145.6))
      const r = k * Math.hypot(W, H) / 2
      ctx.fillStyle = 'rgba(244,246,250,.96)'
      ctx.save(); ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, 7); ctx.fill(); ctx.restore()
    }
    if (t > 149.6 && t < 150.6) {
      const k = ease(seg(t, 149.6, 150.6))
      const r = k * Math.hypot(W, H) / 2
      ctx.fillStyle = 'rgba(14,16,19,.96)'
      ctx.save(); ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, 7); ctx.fill(); ctx.restore()
    }
  })
  drawScanlines(true)
}
function drawScanlines(light) {
  ctx.fillStyle = light ? 'rgba(0,0,0,.05)' : 'rgba(0,0,0,.12)'
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1)
}
let lastT = -1
setInterval(() => {
  const t = T()
  if (t < 0) return
  draw(t)
  lastT = t
  if (window.__track) { try { window.__track.requestFrame() } catch { /* ignore */ } }
}, 1000 / 30)

/* ── 录制接口 ── */
window.__recState = 'idle'; window.__chunks = []
window.startRecording = () => {
  const vstream = cv.captureStream(0)
  window.__track = vstream.getVideoTracks()[0]
  const rec = new MediaRecorder(vstream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 6000000 })
  window.__recState = 'recording'
  t0 = performance.now()
  for (let i = 0; i < 3; i++) window.__track.requestFrame()
  rec.ondataavailable = (e) => { if (e.data && e.data.size) { const fr = new FileReader(); fr.onload = () => window.__chunks.push(String(fr.result).split(',')[1]); fr.readAsDataURL(e.data) } }
  rec.onstop = () => { window.__recState = 'done' }
  rec.start(2000)
  setTimeout(() => { try { rec.stop() } catch { /* ignore */ } }, (window.__duration + 2) * 1000)
}
window.__chunkCount = () => window.__chunks.length
window.__getChunk = (i) => window.__chunks[i] || ''
</script>
